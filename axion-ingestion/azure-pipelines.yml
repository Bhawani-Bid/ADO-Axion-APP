name: axion-ingestion-deployment

trigger: none
  # branches:
  #   include:
  #     - main

pool:
  name: jarvis

variables:
  acrLoginServer: 'axionacrdevnmkdck.azurecr.io'
  imageRepository: 'axion-ingestion'
  imageTag: '$(Build.BuildId)'

  namespace: 'axion-app'
  


stages:
- stage: Build
  displayName: Build and Push

  jobs:
  - job: DockerBuild
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        containerRegistry: 'ACR-ServiceConnection'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: '$(imageTag)'


    - powershell: |
        Write-Host "========================================="
        Write-Host "Image pushed:"
        Write-Host "$(acrLoginServer)/$(imageRepository):$(imageTag)"
        Write-Host "========================================="
      displayName: Show Image

- stage: DeployToAKS
  displayName: Deploy To AKS
  jobs:
    - job: IngestionDeploy
      displayName: Ingestion Deploy
      steps:
      - checkout: self
      - task: KubernetesManifest@1
        inputs:
          action: 'deploy'
          connectionType: 'kubernetesServiceConnection'
          kubernetesServiceConnection: 'AksServiceConnection'
          namespace: '$(namespace)'
          manifests: 'manifests/*.yaml'
          containers: $(acrLoginServer)/$(imageRepository):$(imageTag)

